<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="plaintec: agentic AI, full stack, mobile and UI/UX" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a1736" stroke-width="1"/>
    </pattern>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',monospace; }
      .cmd { fill:#8b87b8; font-size:13px; }
      .big { font-size:54px; font-weight:800; letter-spacing:2px; }
      .sub { fill:#e8e6ff; font-size:14px; }
      .tag { fill:#8b87b8; font-size:12px; }
      .chip { font-size:11px; font-weight:700; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="238" rx="16" fill="#0f0d24" stroke="#1f1b3d"/>
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#grid)" opacity="0.6"/>

  <circle cx="30" cy="30" r="5" fill="#f472b6"/>
  <circle cx="48" cy="30" r="5" fill="#a78bfa"/>
  <circle cx="66" cy="30" r="5" fill="#2dd4bf"/>

  <text x="40" y="78" class="cmd">plaintec@lahore:~$ ./about --org</text>
  <text x="40" y="140" class="big" fill="url(#g)">PLAINTEC</text>
  <rect x="42" y="152" width="300" height="3" rx="1.5" fill="url(#g)"/>
  <text x="40" y="184" class="sub">Agentic AI  ·  Full Stack  ·  Mobile  ·  UI/UX</text>
  <text x="40" y="208" class="tag">Designing it beautifully, building it properly, shipping it.</text>

  <!-- decorative tech chips -->
  <g>
    <circle cx="730" cy="120" r="78" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-dasharray="2 6"/>
    <circle cx="730" cy="120" r="44" fill="none" stroke="#a78bfa" stroke-opacity="0.25"/>
    <rect x="696" y="40" width="48" height="26" rx="13" fill="#14122b" stroke="#a78bfa"/>
    <text x="720" y="57" text-anchor="middle" class="chip" fill="#a78bfa">py</text>
    <rect x="780" y="88" width="48" height="26" rx="13" fill="#14122b" stroke="#2dd4bf"/>
    <text x="804" y="105" text-anchor="middle" class="chip" fill="#2dd4bf">ts</text>
    <rect x="780" y="150" width="48" height="26" rx="13" fill="#14122b" stroke="#f472b6"/>
    <text x="804" y="167" text-anchor="middle" class="chip" fill="#f472b6">AI</text>
    <rect x="696" y="176" width="48" height="26" rx="13" fill="#14122b" stroke="#a78bfa"/>
    <text x="720" y="193" text-anchor="middle" class="chip" fill="#a78bfa">sql</text>
    <rect x="632" y="106" width="48" height="26" rx="13" fill="#14122b" stroke="#2dd4bf"/>
    <text x="656" y="123" text-anchor="middle" class="chip" fill="#2dd4bf">&lt;/&gt;</text>
    <text x="730" y="128" text-anchor="middle" fill="url(#g)" style="font-size:30px;font-weight:800">pt_</text>
  </g>
</svg>
